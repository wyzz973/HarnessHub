name: SEA spike

# OSS-008 single-executable feasibility spike (ADR-P01). Builds the SEA on each target's
# native runner, measures size and cold start, and runs the end-to-end check from
# tools/sea/measure.mjs. Runs on demand and on pull requests that change the SEA
# tooling; uploads small JSON results per platform (sea-<target>, and the start phases in
# sea-phases-<target>) and never publishes the binary.
# Findings: docs/proposals/oss/sea-spike.md.
on:
  pull_request:
    paths:
      - "tools/sea/**"
      - ".github/workflows/sea-spike.yml"
  workflow_dispatch:
    inputs:
      runs:
        description: Measured starts per series (each with a fresh data directory)
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: sea-spike-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sea:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          # macos-13 is no longer offered to public repositories (checked 2026-10-02);
          # macos-15-intel is the remaining x64 macOS image.
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: win32-x64
            os: windows-latest
    name: sea (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Confirm the runner matches the target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: node -e 'const actual = `${process.platform}-${process.arch}`; if (actual !== process.env.TARGET) { console.error(`runner is ${actual}, expected ${process.env.TARGET}`); process.exit(1); }'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the single executable
        run: node tools/sea/build.mjs
      # Diagnostic, read-only: whether Defender real-time protection was on for the timings below.
      - name: Record the Defender status (diagnostic)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist/sea | Out-Null; Get-MpComputerStatus | Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, IoavProtectionEnabled, BehaviorMonitorEnabled | ConvertTo-Json | Tee-Object dist/sea/defender-win32-x64.json
      - name: Measure and run the end-to-end check
        shell: bash
        env:
          RUNS: ${{ inputs.runs || '10' }}
          TARGET: ${{ matrix.target }}
        run: node tools/sea/measure.mjs --runs "$RUNS" --baseline --out "dist/sea/result-$TARGET.json" --phases-out "dist/sea/phases-$TARGET.json"
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sea-${{ matrix.target }}
          path: |
            dist/sea/result-${{ matrix.target }}.json
            dist/sea/build.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload the phase report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sea-phases-${{ matrix.target }}
          path: |
            dist/sea/phases-*.json
            dist/sea/defender-*.json
          if-no-files-found: warn
          retention-days: 30
