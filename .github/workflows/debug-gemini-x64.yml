name: Debug Gemini shell on Windows x64

# Debug-only workflow for the Gemini shell-tool hang in the released x64 competition bundle.
# No model key: Gemini runs through the competition Gateway against the scripted mock model.
on:
  push:
    branches:
      - ci/x64-debug-gemini

permissions:
  contents: read

jobs:
  gemini:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the released x64 competition bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $zipName = "harnesshub-competition-full-windows-x64.zip"
          gh release download competition-latest --repo $env:GITHUB_REPOSITORY --pattern "harnesshub-competition-full-windows-x64*" --dir D:\dl
          if ($LASTEXITCODE -ne 0) { throw "download failed" }
          Get-Content D:\dl\harnesshub-competition-full-windows-x64.build.json
          $zip = "D:\dl\$zipName"
          $expected = ((Get-Content -Raw -LiteralPath "$zip.sha256").Trim() -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ZIP SHA-256 mismatch: $actual" }
          & (Join-Path $env:ProgramFiles "7-Zip\7z.exe") x -y "-oD:\hh" $zip | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "extract failed" }
          Remove-Item -LiteralPath $zip -Force
          New-Item -ItemType Directory -Force -Path D:\dbg | Out-Null

      - name: Inventory - node-pty packages, PowerShell and the Gemini launch recipe
        run: |
          Get-ChildItem D:\hh\engines\npm\node_modules\@lydell -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          "node-pty dir: $(Test-Path D:\hh\engines\npm\node_modules\node-pty)"
          Get-ChildItem D:\hh\engines\npm\node_modules\node-pty -Recurse -Filter *.node -ErrorAction SilentlyContinue | Select-Object FullName
          Get-Command pwsh, powershell -ErrorAction SilentlyContinue | Select-Object Source, Version | Format-Table -AutoSize | Out-String -Width 300
          "ComSpec=$env:ComSpec"
          $catalog = Get-ChildItem D:\hh -Filter *.json -Depth 1 | Where-Object { (Get-Content -Raw $_.FullName) -match 'gemini-cli' } | Select-Object -First 3
          foreach ($file in $catalog) { "=== $($file.FullName)"; (Get-Content -Raw $file.FullName) -split "`n" | Select-String -Pattern 'gemini' -Context 0,3 | Select-Object -First 12 }

      - name: Probe - Gemini's shell paths in a plain process
        run: |
          & D:\hh\runtime\node.exe .github\scripts\gemini-debug\pty_probe.mjs D:\hh D:\dbg\probe console

      - name: Probe - Gemini's shell paths from a process reading a stdin pipe (ACP-like)
        run: |
          & D:\hh\runtime\node.exe .github\scripts\gemini-debug\pty_probe.mjs D:\hh D:\dbg\probe console-pending

      - name: Reproduce - Gemini through the competition Gateway with the scripted mock (released bundle)
        run: |
          $p = Start-Process -FilePath D:\hh\runtime\node.exe -ArgumentList @("scripts/competition-matrix.mjs", "--bundle", "D:\hh", "--engines", "gemini", "--out", "D:\dbg\matrix-released", "--mock", "--engine-timeout-ms", "420000") -PassThru -NoNewWindow -RedirectStandardOutput D:\dbg\matrix-released.out.txt -RedirectStandardError D:\dbg\matrix-released.err.txt
          & .github\scripts\gemini-debug\watch_gemini.ps1 -WatchPid $p.Id -Out D:\dbg\watch-released -MockLog D:\dbg\matrix-released\mock-requests.jsonl -Node D:\hh\runtime\node.exe -Dump .github\scripts\gemini-debug\node_dump.mjs -Seconds 240
          if (-not $p.HasExited) { taskkill /PID $p.Id /T /F | Out-Null; "matrix killed after 240 s" }
          Get-Content D:\dbg\matrix-released\summary.md -ErrorAction SilentlyContinue
          Get-Content D:\dbg\matrix-released\mock-requests.jsonl -ErrorAction SilentlyContinue
          Get-Content D:\dbg\watch-released\dump.log -ErrorAction SilentlyContinue
          Get-ChildItem D:\dbg\watch-released -Filter gemini-dump-*.json | ForEach-Object { "=== $($_.Name)"; Get-Content -Raw $_.FullName | Select-Object -First 1 }

      - name: Candidate fix - Gemini system settings disable the PTY shell (compiled prepare.js)
        run: |
          $ErrorActionPreference = "Stop"
          $file = "D:\hh\dist\src\drivers\configuration\prepare.js"
          $text = [IO.File]::ReadAllText($file)
          $anchor = "disableLLMCorrection: true,"
          if (([regex]::Matches($text, [regex]::Escape($anchor))).Count -ne 1) { throw "anchor count differs" }
          $text = $text.Replace($anchor, "$anchor shell: { enableInteractiveShell: false },")
          [IO.File]::WriteAllText($file, $text)
          Select-String -Path $file -Pattern "enableInteractiveShell"

      - name: Verify - Gemini through the competition Gateway with the scripted mock (candidate fix)
        run: |
          $p = Start-Process -FilePath D:\hh\runtime\node.exe -ArgumentList @("scripts/competition-matrix.mjs", "--bundle", "D:\hh", "--engines", "gemini", "--out", "D:\dbg\matrix-fixed", "--mock", "--engine-timeout-ms", "420000") -PassThru -NoNewWindow -RedirectStandardOutput D:\dbg\matrix-fixed.out.txt -RedirectStandardError D:\dbg\matrix-fixed.err.txt
          & .github\scripts\gemini-debug\watch_gemini.ps1 -WatchPid $p.Id -Out D:\dbg\watch-fixed -MockLog D:\dbg\matrix-fixed\mock-requests.jsonl -Node D:\hh\runtime\node.exe -Dump .github\scripts\gemini-debug\node_dump.mjs -Seconds 480
          if (-not $p.HasExited) { taskkill /PID $p.Id /T /F | Out-Null; "matrix killed after 480 s" }
          Get-Content D:\dbg\matrix-fixed\summary.md -ErrorAction SilentlyContinue
          Get-Content D:\dbg\matrix-fixed\mock-requests.jsonl -ErrorAction SilentlyContinue

      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-debug-x64
          path: D:\dbg
          retention-days: 7
