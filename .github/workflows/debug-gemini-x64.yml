name: Debug Gemini shell on Windows x64

# Debug-only workflow for the Gemini shell-tool stall in the released x64 competition bundle.
# No model key: Gemini runs through the competition Gateway against the scripted mock model.
# Round 2: every Windows PowerShell start takes ~20-25 s inside the engine environment, so
# time PowerShell under environment variants, then retry Gemini with the Worker passing the
# standard Windows system variables.
on:
  push:
    branches:
      - ci/x64-debug-gemini

permissions:
  contents: read

jobs:
  gemini:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract the released x64 competition bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $zipName = "harnesshub-competition-full-windows-x64.zip"
          gh release download competition-latest --repo $env:GITHUB_REPOSITORY --pattern "harnesshub-competition-full-windows-x64*" --dir D:\dl
          if ($LASTEXITCODE -ne 0) { throw "download failed" }
          Get-Content D:\dl\harnesshub-competition-full-windows-x64.build.json
          $zip = "D:\dl\$zipName"
          $expected = ((Get-Content -Raw -LiteralPath "$zip.sha256").Trim() -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ZIP SHA-256 mismatch: $actual" }
          & (Join-Path $env:ProgramFiles "7-Zip\7z.exe") x -y "-oD:\hh" $zip | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "extract failed" }
          Remove-Item -LiteralPath $zip -Force
          New-Item -ItemType Directory -Force -Path D:\dbg | Out-Null

      - name: Time Windows PowerShell under engine-like environment variants
        run: |
          & D:\hh\runtime\node.exe .github\scripts\gemini-debug\env_probe.mjs D:\hh D:\dbg\env

      - name: Candidate fix - Worker passes the standard Windows system variables (compiled worker-host.js)
        run: |
          $ErrorActionPreference = "Stop"
          $file = "D:\hh\dist\src\process\worker-host.js"
          $text = [IO.File]::ReadAllText($file)
          $anchor = '"LOGNAME",'
          if (([regex]::Matches($text, [regex]::Escape($anchor))).Count -ne 1) { throw "anchor count differs" }
          $names = '"PROGRAMFILES", "PROGRAMFILES(X86)", "PROGRAMW6432", "COMMONPROGRAMFILES", "COMMONPROGRAMFILES(X86)", "COMMONPROGRAMW6432", "PROGRAMDATA", "ALLUSERSPROFILE", "PUBLIC", "COMPUTERNAME", "USERDOMAIN", "PSMODULEPATH",'
          $text = $text.Replace($anchor, "$anchor $names")
          [IO.File]::WriteAllText($file, $text)
          Select-String -Path $file -Pattern "PROGRAMDATA"

      - name: Verify - Gemini through the competition Gateway with the scripted mock (candidate fix)
        run: |
          $p = Start-Process -FilePath D:\hh\runtime\node.exe -ArgumentList @("scripts/competition-matrix.mjs", "--bundle", "D:\hh", "--engines", "gemini", "--out", "D:\dbg\matrix-system", "--mock", "--engine-timeout-ms", "420000") -PassThru -NoNewWindow -RedirectStandardOutput D:\dbg\matrix-system.out.txt -RedirectStandardError D:\dbg\matrix-system.err.txt
          & .github\scripts\gemini-debug\watch_gemini.ps1 -WatchPid $p.Id -Out D:\dbg\watch-system -MockLog D:\dbg\matrix-system\mock-requests.jsonl -Node D:\hh\runtime\node.exe -Dump .github\scripts\gemini-debug\node_dump.mjs -Seconds 420
          if (-not $p.HasExited) { taskkill /PID $p.Id /T /F | Out-Null; "matrix killed after 420 s" }
          Get-Content D:\dbg\matrix-system\summary.md -ErrorAction SilentlyContinue
          Get-Content D:\dbg\matrix-system\mock-requests.jsonl -ErrorAction SilentlyContinue

      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-debug-x64-round2
          path: |
            D:\dbg\env\*.jsonl
            D:\dbg\matrix-system
            D:\dbg\watch-system
            D:\dbg\*.txt
          retention-days: 7
