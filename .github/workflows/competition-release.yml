name: Competition release publisher

on:
  push:
    branches:
      - feat/competition-gateway-api
    paths:
      - .github/workflows/competition-release.yml
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Competition full bundle workflow run id
        required: false
        default: "34204510909"

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download successful Full Bundle artifact archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $runId = if ($env:INPUT_RUN_ID) { $env:INPUT_RUN_ID } else { "34204510909" }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/artifacts"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $result = Invoke-RestMethod -Headers $headers -Uri $api
          $artifact = @($result.artifacts | Where-Object { $_.name -eq "harnesshub-competition-full-windows-arm64" })
          if ($artifact.Count -ne 1) {
            throw "Expected one Full Bundle artifact in run $runId, found $($artifact.Count)"
          }
          $zip = Join-Path $PWD "harnesshub-competition-full-windows-arm64.zip"
          Invoke-WebRequest -Headers $headers -Uri $artifact[0].archive_download_url -OutFile $zip -MaximumRedirection 10
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($artifact[0].digest -and $artifact[0].digest -ne "sha256:$actual") {
            throw "Artifact digest mismatch: $actual"
          }
          "$actual *harnesshub-competition-full-windows-arm64.zip" | Set-Content -Encoding Ascii "$zip.sha256"
          "FULL_BUNDLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FULL_BUNDLE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish stable competition-latest Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "competition-latest"
          $zip = $env:FULL_BUNDLE_ZIP
          $sha = "$zip.sha256"
          $notes = @"
          HarnessHub Competition Full Bundle for Windows 11 ARM64.

          Includes the competition Gateway plus bundled Codex, Gemini, Qwen, Pi, MiMo, DSH, OpenClaw, Kimi, OpenCode and Hermes engines, together with the fixed runtime/tooling from the verified offline bundle.

          Start after configuring the model/provider:
            gateway.cmd --engine opencode

          SHA-256: $env:FULL_BUNDLE_SHA
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sha --clobber
            gh release edit $tag --title "HarnessHub Competition Full Bundle" --notes $notes --prerelease
          } else {
            gh release create $tag $zip $sha --title "HarnessHub Competition Full Bundle" --notes $notes --prerelease --target "$env:GITHUB_SHA"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Competition Release publish failed"
          }
          Write-Host "Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
          Write-Host "Direct: https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/harnesshub-competition-full-windows-arm64.zip"
