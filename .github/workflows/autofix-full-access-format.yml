name: One-shot format full-access sources

on:
  push:
    branches:
      - feat/competition-gateway-api
    paths:
      - .github/workflows/autofix-full-access-format.yml

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/competition-gateway-api

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format changed TypeScript and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            src/competition-bundle-main.ts \
            src/distribution/full-access.ts \
            src/drivers/acp/driver.ts \
            src/tool-packages-oneclick-main.ts
          rm .github/workflows/autofix-full-access-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/competition-bundle-main.ts src/distribution/full-access.ts src/drivers/acp/driver.ts src/tool-packages-oneclick-main.ts .github/workflows/autofix-full-access-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: format full-access sources"
          git push origin HEAD:feat/competition-gateway-api
